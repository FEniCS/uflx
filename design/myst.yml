version: 1
project:
  title: UFLx design notes
  authors:
    - name: Jack S. Hale
    - name: Matthew Scroggs
    - name: Michal Habera
  github: https://github.com/FEniCS/uflx
  toc:
    - file: README.md
    - file: DESIGN.md
    - file: LANGUAGE.md
